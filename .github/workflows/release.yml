name: Release Pipeline

on:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  # ------------------------
  # Release (manual, main only)
  # ------------------------
  release:
    name: Release

    if: github.ref == 'refs/heads/main'
    needs: [lint]
    runs-on: ubuntu-latest

    environment: release
    concurrency: release

    outputs:
      release_version: ${{ steps.bump_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: Bump version
        id: bump_version
        run: |
          node scripts/updatePackageJson.js
          VERSION=$(node -e "const pkg=require('./package.json');console.log(pkg.version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "kotahi release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git checkout -b release/${{ steps.bump_version.outputs.version }}
          git add -A
          git commit -m "release version ${{ steps.bump_version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin release/${{ steps.bump_version.outputs.version }}

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh pr create \
            --base main \
            --head release/${{ steps.bump_version.outputs.version }} \
            --title "Release ${{ steps.bump_version.outputs.version }}" \
            --body "Automated release of version ${{ steps.bump_version.outputs.version }}"

      - name: Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_NUMBER=$(gh pr list --head release/${{ steps.bump_version.outputs.version }} --json number -q '.[0].number')
          gh pr merge $PR_NUMBER --merge --admin --delete-branch

      - name: Tag release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git fetch origin main
          git checkout main
          git pull origin main
          git tag -f ${{ steps.bump_version.outputs.version }}
          git push -f origin ${{ steps.bump_version.outputs.version }}

      - name: Sync version to staging
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION=${{ steps.bump_version.outputs.version }}
          BRANCH=chore/sync-version-$VERSION
          git fetch origin staging
          git checkout -B $BRANCH origin/staging
          for f in package.json packages/client/package.json packages/server/package.json; do
            sed -i -E "s/(\"version\": \")[^\"]+(\")/\1$VERSION\2/" "$f"
          done
          git add -A
          git commit -m "chore(*): sync release version $VERSION to staging [skip ci]" \
            || { echo "Staging already at $VERSION, nothing to sync"; exit 0; }
          git push -f origin $BRANCH
          gh pr create \
            --base staging \
            --head $BRANCH \
            --title "Sync version $VERSION to staging" \
            --body "Automated sync of released version \`$VERSION\` back to staging." \
            || echo "PR already exists"
          gh pr merge $BRANCH \
            --merge --admin --delete-branch \
            --subject "Merge: sync version $VERSION to staging [skip ci]"

  # ------------------------
  # Publish (DockerHub)
  # ------------------------
  publish_client:
    name: Publish client

    if: github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.release_version }}

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Docker push client
        run: |
          cd packages/client
          docker build -t cokoapps/kotahi-client:${{ needs.release.outputs.release_version }} -f Dockerfile-production .
          docker push cokoapps/kotahi-client:${{ needs.release.outputs.release_version }}

  publish_server:
    name: Publish server

    if: github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.release_version }}

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Docker push server
        run: |
          cd packages/server
          docker build -t cokoapps/kotahi-server:${{ needs.release.outputs.release_version }} -f Dockerfile-production .
          docker push cokoapps/kotahi-server:${{ needs.release.outputs.release_version }}

  publish_docs:
    name: Publish docs

    if: github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs packages:write to push to GHCR. Declaring the block
    # sets every unlisted scope to none, so contents:read is required for checkout.
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Docker push docs
        id: build
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$REPO/devdocs:${{ github.sha }}"
          cd packages/devdocs
          docker build -t "$IMAGE" -f Dockerfile-production .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy_docs:
    name: Deploy docs

    if: github.ref == 'refs/heads/main'
    needs: [publish_docs]
    runs-on: ubuntu-latest

    container:
      image: cokoapps/fly

    steps:
      - uses: actions/checkout@v6

      - name: Deploy docs to fly
        run: fly deploy -c .fly/kotahi-dev-docs.toml --image ${{ needs.publish_docs.outputs.image }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEV_DOCS_TOKEN }}
