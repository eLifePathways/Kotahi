enum UserNotificationEventType {
  addedAsEditor
  addedAsHandlingEditor
  addedAsReviewer
  addedAsSeniorEditor
  decisionMade
  removedAsEditor
  removedAsHandlingEditor
  removedAsReviewer
  removedAsSeniorEditor
  reviewerAcceptedInvitation
  reviewerCompletedReview
  reviewerRejectedInvitation
  revisionSubmitted
}

type UserNotification {
  id: ID!
  manuscriptId: ID
  eventType: UserNotificationEventType!
  data: String!
  created: DateTime!
}

extend type Query {
  userNotifications: [UserNotification!]!
}

extend type Mutation {
  dismissUserNotification(id: ID!): Boolean!
  dismissAllUserNotifications: Boolean!
}
