enum DashboardActionType {
  authorSubmit
  authorRevise
  authorSubmitRevision
  reviewerRespond
  reviewerSubmit
  editorDecide
  taskOverdue
  taskAlmostOverdue
}

enum DashboardBucket {
  submissions
  review
  editingQueue
}

type DashboardActionCardItem {
  id: ID!
  type: DashboardActionType!
  bucket: DashboardBucket!
  manuscriptId: ID!
  shortId: String!
  title: String!
}

type DashboardTableCardData {
  totalCount: Int!
}

type DashboardData {
  actionCardData: [DashboardActionCardItem!]!
  submissionsData: DashboardTableCardData!
  reviewData: DashboardTableCardData!
  editingQueueData: DashboardTableCardData!
}

extend type Query {
  dashboardData: DashboardData!
}
